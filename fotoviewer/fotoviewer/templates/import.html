{% extends "base.html" %}

{% block content %}
    <h2>{{ t("import.title") }}</h2>

    <form class="card filter-form">
      <div class="search-row">
        <label>
          {{ t("import.source") }}
          <input type="text" id="source_path" placeholder="{{ t('import.source_placeholder') }}">
        </label>
      </div>

      <div class="search-row">
        <label>
          {{ t("import.destination") }}
          <select id="destination_folder">
            <option value="">{{ t("import.library_root") }}</option>
            {% for option in folder_options %}
              <option value="{{ option }}">{{ option }}</option>
            {% endfor %}
          </select>
        </label>
        <label>
          {{ t("import.new_folder") }}
          <input type="text" id="new_folder_name" placeholder="{{ t('import.new_folder_placeholder') }}">
        </label>
        <button type="button" id="import_btn" onclick="start_import()">{{ t("import.start") }}</button>
      </div>
    </form>

    <p id="import_status" class="empty-state"></p>
{% endblock %}

{% block scripts %}
    <script>
      const importBtn = document.getElementById("import_btn");
      const statusEl = document.getElementById("import_status");
      let pollHandle = null;

      function renderStatus(status) {
        let text = status.phase === "starting" ? t("js.import.starting") : t("js.phase." + status.phase);
        if (status.running && status.progress && status.progress.total) {
          text += ` ${status.progress.done} / ${status.progress.total}`;
        }
        if (status.phase === "done" && status.copy_result) {
          text = t("js.import.done", {copied: status.copy_result.copied, skipped: status.copy_result.skipped});
        }
        if (status.phase === "error" && status.error) {
          text = t("js.error", {message: status.error});
        }
        statusEl.textContent = text;

        importBtn.disabled = status.running;
        if (status.running && !pollHandle) {
          pollHandle = setInterval(poll, 2000);
        } else if (!status.running && pollHandle) {
          clearInterval(pollHandle);
          pollHandle = null;
        }
      }

      function poll() {
        fetch("/api/import/status")
          .then(response => response.json())
          .then(renderStatus)
          .catch(() => {});
      }

      function start_import() {
        const sourcePath = document.getElementById("source_path").value.trim();
        if (!sourcePath) {
          return;
        }
        importBtn.disabled = true;
        statusEl.textContent = t("js.import.starting");
        fetch("/api/import", {
          method: "POST",
          headers: {"Content-Type": "application/json"},
          body: JSON.stringify({
            source_path: sourcePath,
            destination_folder: document.getElementById("destination_folder").value,
            new_folder_name: document.getElementById("new_folder_name").value.trim(),
          }),
        })
          .then(response => {
            if (!response.ok) {
              return response.json().then(data => { throw new Error(data.detail || response.status); });
            }
            poll();
          })
          .catch(error => {
            statusEl.textContent = t("js.error", {message: error.message});
            importBtn.disabled = false;
          });
      }

      poll();
    </script>
{% endblock %}
