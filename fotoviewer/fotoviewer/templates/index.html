<!doctype html>
<html>
  <head>
    <title>Foto Viewer</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="/static/main.css">
    <script>
      const socket = new WebSocket('ws://' + location.host + '/echo');
      socket.addEventListener('message', msg => {
        data = JSON.parse(msg.data)
        if (data.status != "ok") {
          log(`${data.status}: ${data.reason}`);
        }
        else if (data.command == "search_similar_images" || data.command == "search_images_by_text") {
          const container = document.getElementById("similar_images");
          container.innerHTML = "";
          data.response.forEach(image => {
            const img = document.createElement("img");
            img.className = "simimg";
            img.src = "/images/" + image.file;
            img.addEventListener("click", () => show_metadata(image.file));
            container.appendChild(img);
          });
        }
      })

      function show_metadata(file) {
        fetch("/api/images/metadata?path=" + encodeURIComponent(file))
          .then(response => {
            if (!response.ok) {
              throw new Error(response.status);
            }
            return response.json();
          })
          .then(data => {
            const rows = [
              ["Datei", data.path],
              ["Abmessungen", `${data.width} × ${data.height}`],
              ["Dateigröße", `${(data.file_size_bytes / 1024).toFixed(1)} KB`],
              ["Format", data.format || "-"],
              ["Aufnahmedatum", data.date_taken || "-"],
              ["Kamera", [data.camera_make, data.camera_model].filter(Boolean).join(" ") || "-"],
            ];
            document.getElementById("metadata").innerHTML =
              rows.map(([label, value]) => `<div><strong>${label}:</strong> ${value}</div>`).join("\n");
          })
          .catch(() => log("Metadaten konnten nicht geladen werden", "red"));
      }

      function log(text, color) {
        document.getElementById("log").innerHTML = `<span style="color: ${color}">${text}</span><br>`;
      }

      function upload_image(event) {
        var input = document.querySelector("input[type='file']");
        const reader = new FileReader();
        reader.onloadend = () => {
          // Use a regex to remove data url part
          const base64String = reader.result.replace("data:", "").replace(/^.+,/, "");
          var data = {
            command: "search_similar_images",
            image: base64String
          }
          socket.send(JSON.stringify(data));
        };
        reader.readAsDataURL(input.files[0]);
      }

      function search_by_text() {
        const query = document.getElementById("text_query").value;
        var data = {
          command: "search_images_by_text",
          query: query
        }
        socket.send(JSON.stringify(data));
      }
  </script>
  </head>
  <body>
    <div id="container">
      <h2>Search by Text</h2>
      <div class="row">
          <input type="text" id="text_query" placeholder="e.g. a dog on the beach">
          <button onclick="search_by_text()">Search</button>
      </div>
      <h2>Search Similar</h2>
      <div id="log"></div>
      <br>
      <div class="row">
          <input type="file" id="file" placeholder="upload a file" name="file">
          <button onclick="upload_image()">Submit</button>
      </div>
      <div id="similar_images">
      </div>
      <h2>Metadata</h2>
      <div id="metadata"></div>
    </div>
  </body>
</html>
