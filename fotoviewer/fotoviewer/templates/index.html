<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Foto Viewer</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <link rel="stylesheet" href="/static/main.css">
    <script>
      const socket = new WebSocket('ws://' + location.host + '/echo');
      socket.addEventListener('message', msg => {
        data = JSON.parse(msg.data)
        if (data.status != "ok") {
          log(`${data.status}: ${data.reason}`);
        }
        else if (data.command == "search_similar_images" || data.command == "search_images_by_text") {
          const container = document.getElementById("similar_images");
          container.innerHTML = "";
          data.response.forEach(image => {
            const link = document.createElement("a");
            link.href = "/image?path=" + encodeURIComponent(image.file);
            const img = document.createElement("img");
            img.className = "simimg";
            img.src = "/images/" + image.file;
            link.appendChild(img);
            container.appendChild(link);
          });
        }
      })

      function log(text, color) {
        document.getElementById("log").innerHTML = `<span style="color: ${color}">${text}</span><br>`;
      }

      function upload_image(event) {
        var input = document.querySelector("input[type='file']");
        const reader = new FileReader();
        reader.onloadend = () => {
          // Use a regex to remove data url part
          const base64String = reader.result.replace("data:", "").replace(/^.+,/, "");
          var data = {
            command: "search_similar_images",
            image: base64String
          }
          socket.send(JSON.stringify(data));
        };
        reader.readAsDataURL(input.files[0]);
      }

      function search_by_text() {
        const query = document.getElementById("text_query").value;
        var data = {
          command: "search_images_by_text",
          query: query
        }
        socket.send(JSON.stringify(data));
      }
  </script>
  </head>
  <body>
    <div class="page">
      <header class="app-header">
        <a href="/" class="brand">📷 Foto Viewer</a>
      </header>

      <main>
        <section class="card">
          <h2>Suche</h2>
          <div class="search-row">
            <input type="text" id="text_query" placeholder="z. B. ein Hund am Strand">
            <button onclick="search_by_text()">Suchen</button>
          </div>
          <div class="search-row">
            <input type="file" id="file" accept="image/*">
            <button onclick="upload_image()">Ähnliche Bilder finden</button>
          </div>
          <div id="log" class="log"></div>
        </section>

        <div id="similar_images" class="results-grid"></div>
      </main>
    </div>
  </body>
</html>
