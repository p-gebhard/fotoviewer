{% extends "base.html" %}

{% block content %}
    <section class="card">
      <h2>Suche</h2>
      <div class="search-row">
        <input type="text" id="text_query" placeholder="z. B. ein Hund am Strand">
        <button id="text_search_btn" onclick="search_by_text()">Suchen</button>
      </div>
      <div class="search-row">
        <input type="file" id="file" accept="image/*">
        <button id="upload_btn" onclick="upload_image()">Ähnliche Bilder finden</button>
      </div>
      <div id="log" class="log"></div>
    </section>

    <div id="similar_images" class="results-grid"></div>
    <p id="empty_hint" class="empty-state">Suche nach einem Motiv oder lade ein Bild hoch, um ähnliche Fotos zu finden.</p>
{% endblock %}

{% block scripts %}
    <script>
      const socket = new WebSocket('ws://' + location.host + '/echo');
      const textInput = document.getElementById("text_query");
      const searchBtn = document.getElementById("text_search_btn");
      const uploadBtn = document.getElementById("upload_btn");
      const emptyHint = document.getElementById("empty_hint");
      const resultsContainer = document.getElementById("similar_images");

      let busy = false;

      function setBusy(isBusy) {
        busy = isBusy;
        searchBtn.disabled = isBusy;
        uploadBtn.disabled = isBusy;
      }

      function log(text, isError) {
        const el = document.getElementById("log");
        el.textContent = text || "";
        el.style.color = isError ? "var(--color-danger)" : "";
      }

      socket.addEventListener('message', msg => {
        setBusy(false);
        const data = JSON.parse(msg.data);
        if (data.status != "ok") {
          log(data.reason, true);
          return;
        }
        if (data.command == "search_similar_images" || data.command == "search_images_by_text") {
          log("");
          resultsContainer.innerHTML = "";
          if (data.response.length === 0) {
            emptyHint.textContent = "Keine ähnlichen Fotos gefunden.";
            emptyHint.style.display = "";
            return;
          }
          emptyHint.style.display = "none";
          data.response.forEach(image => {
            const link = document.createElement("a");
            link.href = "/image?path=" + encodeURIComponent(image.file);
            const img = document.createElement("img");
            img.className = "simimg";
            img.src = "/images/" + image.file;
            link.appendChild(img);
            resultsContainer.appendChild(link);
          });
        }
      });

      socket.addEventListener('close', () => log("Verbindung getrennt – bitte Seite neu laden.", true));

      function upload_image() {
        if (busy) {
          return;
        }
        const input = document.querySelector("input[type='file']");
        if (!input.files.length) {
          return;
        }
        const reader = new FileReader();
        reader.onloadend = () => {
          // Use a regex to remove data url part
          const base64String = reader.result.replace("data:", "").replace(/^.+,/, "");
          setBusy(true);
          log("Suche läuft …");
          socket.send(JSON.stringify({command: "search_similar_images", image: base64String}));
        };
        reader.readAsDataURL(input.files[0]);
      }

      function search_by_text() {
        if (busy) {
          return;
        }
        const query = textInput.value.trim();
        if (!query) {
          return;
        }
        setBusy(true);
        log("Suche läuft …");
        socket.send(JSON.stringify({command: "search_images_by_text", query: query}));
      }

      textInput.addEventListener("keydown", event => {
        if (event.key === "Enter") {
          search_by_text();
        }
      });
    </script>
{% endblock %}
