[project]
name = "fotoviewer"
version = "0.1.0"
description = "Foto Viewer"
authors = [{ name = "Philipp Gebhard" }]
license = { text = "GPL-v3" }
requires-python = ">=3.10"
dependencies = [
    "torch",
    "torchvision",
    "transformers",
    "numpy",
    "pillow",
    "fastapi",
    "uvicorn[standard]",
    "jinja2",
]

[project.optional-dependencies]
test = ["pytest", "httpx"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
