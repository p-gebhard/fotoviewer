[project]
name = "fotoviewer"
version = "0.1.0"
description = "Foto Viewer"
authors = [{ name = "Philipp Gebhard" }]
license = { text = "GPL-v3" }
requires-python = ">=3.10"
dependencies = [
    "torch",
    "transformers",
    "numpy",
    "pillow",
    "fastapi",
    "uvicorn[standard]",
    "jinja2",
    "pydantic-settings",
    "tqdm",
    "torchvision>=0.28.0",
    "python-dotenv",
    "spandrel>=0.4.2",
    "opencv-python-headless>=5.1.0.95",
]

[dependency-groups]
dev = ["pytest", "httpx"]

[project.scripts]
fotoviewer-create-index = "fotoviewer.cli.create_index:main"
fotoviewer-search = "fotoviewer.cli.search:main"
fotoviewer-index-detections = "fotoviewer.cli.index_detections:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["fotoviewer*"]

[tool.setuptools.package-data]
fotoviewer = ["templates/*.html", "static/*", "locales/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
